name: Build Veather

on:
  push:
    branches: ['**']
    paths:
      - 'App/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'App/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Prepare
        run: |
          # Package.resolved is not committed: the upstream one pinned packages no
          # manifest uses and crashed Xcode's package graph (IDESwiftPackageCore).
          # repos/ holds reference submodules that are not checked out here
          defaults write com.apple.dt.Xcode IDESourceControlEnableSourceControl_10_0 -bool NO
          rm -f ../.gitmodules

      # Swift packages (Vapor, NIO, …) and their compiled objects live in DerivedData and
      # do not change between pushes: restore them so only the app itself is compiled.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Veather/iphoneos
          key: deriveddata-v1-${{ hashFiles('App/Feather.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-v1-

      - name: Build unsigned IPA
        env:
          TMPDIR: ${{ runner.temp }}/
          # no symbol index and no dSYM bundles: not needed for an unsigned IPA, saves minutes
          XCODEBUILD_EXTRA: COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf
        run: |
          agvtool new-version -all ${{ github.run_number }} || true
          make 2>&1 | tee build.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|\*\*' || true
          test -f packages/Veather.ipa
          # old installs look for any .ipa asset; keep the former file name published too
          cp packages/Veather.ipa packages/BetterThanBox.ipa

      # Veather Updater: the same app in "updater mode" (own bundle id, no URL schemes).
      # It only checks for updates and installs the new Veather over the old one.
      - name: Build Updater IPA
        run: |
          set -e
          rm -rf upd && mkdir upd && cd upd
          unzip -q ../packages/Veather.ipa
          APP=$(ls -d Payload/*.app)
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.veather.updater" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Veather\ Updater" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Veather\ Updater" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Updater" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :BTBUpdaterMode bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" || true
          rm -rf "$APP/PlugIns" "$APP/Watch"
          zip -qry ../packages/Veather-Updater.ipa Payload
          cd .. && rm -rf upd
          ls -la packages

      - name: Show errors
        if: failure()
        run: |
          grep -n -B2 -A6 'error:' build.log | head -300 || true
          echo '----- tail -----'
          tail -n 60 build.log || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veather-${{ github.run_number }}
          path: App/packages/Veather.ipa
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.ref_name == 'master' && 'master' || 'dev' }}
          name: Veather nightly (${{ github.ref_name }})
          prerelease: true
          body: "Build ${{ github.run_number }} (${{ github.sha }})"
          files: |
            App/packages/Veather.ipa
            App/packages/BetterThanBox.ipa
            App/packages/Veather-Updater.ipa
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
