name: Build BetterThanBox

on:
  push:
    branches: ['**']
    paths:
      - 'App/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'App/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Prepare
        run: |
          # Package.resolved is not committed: the upstream one pinned packages no
          # manifest uses and crashed Xcode's package graph (IDESwiftPackageCore).
          # repos/ holds reference submodules that are not checked out here
          defaults write com.apple.dt.Xcode IDESourceControlEnableSourceControl_10_0 -bool NO
          rm -f ../.gitmodules

      - name: Build unsigned IPA
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          agvtool new-version -all ${{ github.run_number }} || true
          make 2>&1 | tee build.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|\*\*' || true
          test -f packages/BetterThanBox.ipa

      - name: Show errors
        if: failure()
        run: |
          grep -n -B2 -A6 'error:' build.log | head -300 || true
          echo '----- tail -----'
          tail -n 60 build.log || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BetterThanBox-${{ github.run_number }}
          path: App/packages/BetterThanBox.ipa
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.ref_name == 'master' && 'master' || 'dev' }}
          name: BetterThanBox nightly (${{ github.ref_name }})
          prerelease: true
          body: "Build ${{ github.run_number }} (${{ github.sha }})"
          files: App/packages/BetterThanBox.ipa
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
